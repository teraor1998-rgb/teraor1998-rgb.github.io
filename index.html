<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="iOSアプリの公式情報、プライバシーポリシー、サポート情報を掲載しています。">
  <title>tr98 Apps</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      background: #f7f7f8;
      color: #1d1d1f;
      line-height: 1.7;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e7;
    }

    .container {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
    }

    header .container {
      padding: 22px 0;
    }

    .site-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    main {
      padding: 64px 0 80px;
    }

    .hero {
      margin-bottom: 56px;
    }

    .hero h1 {
      margin: 0 0 16px;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      max-width: 650px;
      color: #6e6e73;
      font-size: 17px;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    .app-card {
      background: #ffffff;
      border: 1px solid #e5e5e7;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .app-card h3 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .app-card p {
      margin: 0;
      color: #6e6e73;
    }

    .status {
      display: inline-block;
      margin-top: 16px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f0f0f2;
      color: #6e6e73;
      font-size: 13px;
    }

    footer {
      border-top: 1px solid #e5e5e7;
      color: #86868b;
      font-size: 13px;
    }

    footer .container {
      padding: 24px 0 36px;
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <p class="site-title">tr98 Apps</p>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero">
        <h1>Apps</h1>
        <p>
          個人で開発しているiOSアプリの公式情報、
          プライバシーポリシー、サポート情報を掲載しています。
        </p>
      </section>

      <section>
        <h2>アプリ</h2>

        <article class="app-card">
          <h3>SplitBrowser</h3>
          <p>
            複数のWebページを同時に表示できるiOS向けブラウザアプリです。
          </p>
          <span class="status">公開準備中</span>
        </article>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      © 2026 tr98 Apps
    </div>
  </footer>
</body>
</html>
